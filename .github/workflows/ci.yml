name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.sources.outputs.runtime }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate harness and contributor tooling
        run: make tools-python verify-harness check-docs test-tooling lint-python
      - name: Detect runtime sources
        id: sources
        shell: bash
        run: |
          source_manifest="$RUNNER_TEMP/gateway-go-sources"
          trap 'rm -f "$source_manifest"' EXIT
          git ls-files '*.go' > "$source_manifest"
          if [ -s "$source_manifest" ]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
            echo '::notice::M0 has no Go runtime sources; runtime acceptance remains unverified.'
          fi

  runtime:
    needs: harness
    if: needs.harness.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned repository tools
        run: make tools
      - name: Complete engineering gate
        run: make check
